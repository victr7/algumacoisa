<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        /* a lá do mei */
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .header {
        /* a lá de cima */
        background-color: #000000;
        color: white;
        text-align: center;
        padding: 20px;
        width: 200px;
        margin: 20px auto 0;
        border-radius: 5px;
      }

      .content {
        flex: 1;
        display: flex;
        justify-content: center; /* centraliza horizontal */
        align-items: center; /* centraliza vertical */
      }

      .footer {
        /* a lá de baixo */
        background-color: #000000;
        height: 18%;
      }

      img {
        max-width: 300px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="header">CORINTHIANS</div>

    <div class="content">
      <img src="874-removebg-preview.png" alt="Logo inserido" />
    </div>

    <div class="footer"></div>
  </body>
</html>
