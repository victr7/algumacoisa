<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      margin: 0px;
      padding: 20px;
      display: flex;
      justify-content: center;
      background: #ffffff;
    }

    .quadradox {
      width: 80%;
      border: 2px solid #000000;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    .cabeçalho, .baixo {
      background:  #8c00ff;
      height: 80px;
    }

    .linhadomei {
      display: flex;
      gap: 10px;
      height: 300px;
    }

    .alinhamentolinhadomei {
      flex: 1;
      background: #8c00ff;
    }

    .content {
      flex: 3;
      background: #8c00ff;
    }
  </style>
</head>
<body>
  <div class="quadradox">
    <div class="cabeçalho"></div>
    <div class="linhadomei">
      <div class="alinhamentolinhadomei"></div>
      <div class="content"></div>
    </div>
    <div class="baixo"></div>
  </div>
</body>
</html>
<!DOCTYPE html>
