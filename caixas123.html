<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
        /* Caixa do do meio que tá em branco */
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
        /* Caixa de cima com a palavra dentro */
      background-color: #000000;
      color: white;
      text-align: center;
      padding: 20px;
      width: 200px;
      margin: 20px auto 0;
      border-radius: 5px;
    }

    .content {
      flex: 1;
    }

    .footer {
        /* A lá de baixo */
      background-color: #000000;
      height: 30%;
    }
  </style>
</head>
<body>

  <div class="header">FRIFAIRE</div>

  <div class="content"></div>

  <div class="footer"></div>

</body>
</html>
