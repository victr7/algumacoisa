<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .login-container {
      text-align: center;
      background-color: rgb(255, 255, 255);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 250px;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background-color: #001aff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #001aff;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Login</h1>
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" placeholder="Digite seu nome"> <br>
    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" placeholder="Digite sua senha"> <br>
    <button type="submit">Entrar</button>
  </div>

</body>
</html>
